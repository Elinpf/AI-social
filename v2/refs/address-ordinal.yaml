# D10 C-A「称呼与关系演化」——称呼有序词表（**先冻结、后出数**）
#
# 身份：这是 `tools/metrics/address_drift.py` 的唯一口径来源。尺子只读本文件，
#       因此「词表身份」= 本文件 sha256（见 v2/refs/D10-address-freeze-receipt.txt）。
#
# 纪律（三条，违反任一条本维度结论作废）：
#   1. **先冻结、后出数**：本文件落盘并记 sha256 的时间必须早于第一次出数；
#      出数之后不得修改词表（改 = 事后调尺）。
#   2. **有序性是判断，不是测量**：tier 数字是作者的社区常识约定（见 `rationale`），
#      不是从数据里统计出来的。报告必须原样披露这一点，并给出 `coarse_tiers` 敏感性归并。
#   3. **称呼 ≠ 礼貌**：tier 高只表示称呼形式更近（昵称/伙伴式），不代表台词更好。
#
# 为什么用「有向对 + 呼语位」而不是全文关键词：全文匹配会把「石叔家的豆腐」这类
# 提及（非称呼）也算成称呼，虚高覆盖率。呼语位规则见 `vocative`，在出数前写死。

version: address-ordinal-v1

# ===== 一、形式来源规则（从 code/config/personas.json 自动派生，不手抄人名）=====
sources:
  personas: code/config/personas.json
  base_from: "display_name.split('·')[-1]"   # 如 '青溪镇·老石' -> '老石'
  base_tier_default: 3                        # 裸名/昵称 = tier 3
  base_tier_overrides:                        # 本名本身即「身份敬称型」的，按身份型计
    方老师: 1
    金先生: 1
    陈医: 1
    周公文: 1
    桂婶: 2
    兰姐: 2
  surname_rule: "base[1:] if base startswith ('老','阿') else base[:1]"  # 老石->石 阿禾->禾 秀娘->秀
  suffix_tiers:                               # 姓名 + 后缀 的组合形式
    师傅: 1
    老板: 1
    老师: 1
    先生: 1
    大夫: 1
    医生: 1
    叔: 2
    婶: 2
    姐: 2
    哥: 2
    嫂: 2
    大爷: 2
    大娘: 2
    妹子: 2
    弟: 2
  suffix_applied_to: [base, surname]           # 既认「石叔」也认「老石叔」这类；两个来源都派生

# ===== 二、不带人名的通用称呼（全体居民共享）=====
generic_tokens:
  0:  # 指代/客套：既不叫名也不叫身份（最疏）
    - 这位
    - 那位
    - 那谁
    - 人家
    - 你
  1:  # 身份/职业敬称
    - 师傅
    - 老板
    - 老板娘
    - 掌柜
    - 东家
    - 大夫
    - 医生
    - 老师
    - 先生
    - 太太
  2:  # 乡亲/亲属类推泛称
    - 街坊
    - 乡亲
    - 邻居
    - 大爷
    - 大娘
    - 婶子
    - 嫂子
    - 大妹子
    - 老弟
    - 老嫂子
  4:  # 伙伴式（极近）
    - 老伙计
    - 老哥
    - 老友
    - 兄弟
    - 咱们

# ===== 三、呼语位规则（出数前写死；不满足即不算「称呼」）=====
vocative:
  # 命中位置的**前一个字符**必须属于（或位于句首）
  prev_chars: ["", "，", "。", "！", "？", "；", "：", "、", "“", "「", "…", "\n", " ", "哎", "喂", "嗨", "哟"]
  # 命中位置的**后一个字符**必须属于（或位于句末）
  next_chars: ["，", "。", "！", "？", "；", "：", "、", "”", "」", "…", "\n", " ", "啊", "呀", "哎", "呢", "吧", "哈", "嘛", "你", "您", ""]
  longest_match_first: true   # 「方老师」优先于「老师」；「石师傅」优先于「师傅」
  note: "同一句话命中多个称呼时，取**最靠前**的一个作为该条 MSG 的称呼（一句话通常只叫一次）"

# ===== 四、敏感性归并（有序性本身是判断 ⇒ 必须给粗粒度复算）=====
coarse_tiers:
  粗疏: [0, 1]
  乡亲: [2]
  近昵: [3, 4]

  # 说明：「石叔你来了」这类「称呼紧接第二人称」在汉语口语里是典型呼语，故 next_chars 收 `你`/`您`；
  #       「石叔家的豆腐」的下一字是 `家`，仍被排除（属提及而非称呼）。

# ===== 五、有序性理由（披露给读者，便于反驳）=====
rationale: |
  1. tier0「这位/那位/那谁/你」：不投入任何身份信息，只做指代 ⇒ 视为最疏。
  2. tier1「X师傅/X老板/方老师/金先生」：给出身份但保持职业/礼节距离 ⇒ 次疏。
  3. tier2「石叔/桂婶/兰姐/街坊」：借亲属称谓做类推，是小镇里"熟人但不至亲"的主形态。
  4. tier3「老石/阿禾/秀娘」：直呼其名/昵称，熟人之间的默认形态。
  5. tier4「老伙计/咱们/兄弟」：伙伴式，暗示共同经历 ⇒ 视为最亲。
  反方可主张 tier2 与 tier3 对调（"叫名比叫婶更亲"），故本表同时给出 coarse_tiers
  （tier2 独立一档，tier0/1 与 tier3/4 各自合并），并用 coarse 复算一次主判。
